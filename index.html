<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* VOICE everyday learning tool for adult professionals: calm, warm, respectful
   IDEA the still surface of water: a drop falls (the question), ripples widen (reflection)
   PICTURE concentric ripples in a deep-water band; the teacher's goal surfaces as a reflected sentence
   COLOUR deep water #0f4c55 dominant, lagoon #3fb6b2 support, sunset coral #f2684a accent, white ground
   TYPE Readex Pro for titles + IBM Plex Sans Arabic for text
   LAYOUT phone-first single column for teachers; wide two-panel dashboard for the trainer */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a1a1e);--surf:light-dark(#f3f8f8,#11272c);--line:light-dark(#d6e6e6,#22424a);
--ink:light-dark(#10292e,#e6f2f1);--soft:light-dark(#4d6a6f,#9bb9bb);
--deep:light-dark(#0f4c55,#0d3d45);--lagoon:light-dark(#2a9d99,#4cc3be);--lagoonbg:light-dark(#e3f4f3,#163a3d);
--coral:light-dark(#e0563a,#f2785c);--coralbg:light-dark(#fdece7,#3a2420);--ok:light-dark(#1f7a4d,#5fcf95);--okbg:light-dark(#e4f4ea,#173528);
--warn:light-dark(#a35d00,#f0b354);--warnbg:light-dark(#fdf1dd,#3a2c14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.2;margin:0;letter-spacing:0}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:22px}h3{font-size:18px}
p{margin:.4em 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.wide{max-width:1180px;margin:0 auto;padding:0 max(16px,3vw)}
.band{background:var(--deep);color:#eef8f7;position:relative;overflow:hidden}
.band .rip{position:absolute;inset:auto -60px -120px auto;width:340px;height:340px;opacity:.5;pointer-events:none}
.band a,.band .soft{color:#b9dedb}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Readex Pro";font-weight:700;font-size:20px}
.logo svg{width:34px;height:34px}
.hero{padding:6px 0 28px;position:relative}
.hero p{color:#cfe9e6;max-width:46ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;background:var(--lagoonbg);color:var(--ink);white-space:nowrap}
.band .chip{background:rgba(255,255,255,.12);color:#eef8f7}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.cor{background:var(--coralbg);color:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600}
.btn:hover{border-color:var(--lagoon)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.sec{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.on{background:var(--lagoonbg);border-color:var(--lagoon)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.stack>*+*{margin-top:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.white{background:var(--bg)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],textarea,select{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:96px;resize:vertical}
.muted{color:var(--soft);font-size:14px}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.act:hover{border-color:var(--lagoon)}
.act .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surf);border:1.5px solid var(--line)}
.act.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.act.live{border-color:var(--coral);box-shadow:0 0 0 3px var(--coralbg)}
.act b{display:block}
.live-bar{position:sticky;top:0;z-index:5;background:var(--coral);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.live-bar .btn{background:#fff;color:var(--coral);border-color:#fff;min-height:36px}
.nav{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:2px;color:var(--soft);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--deep);background:var(--lagoonbg);font-weight:700}
:root[data-theme=dark] .nav button.on{color:var(--ink)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--coral);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
.back{background:none;border:0;color:var(--soft);display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.opt.on{border-color:var(--lagoon);background:var(--lagoonbg)}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;color:#fff;font-size:14px}
.opt.on .box{background:var(--lagoon);border-color:var(--lagoon)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.note{background:var(--lagoonbg);border-radius:14px;padding:12px 14px;font-size:15px}
.note.mine{background:var(--coralbg)}
.note small{display:block;color:var(--soft);margin-top:6px;font-size:13px}
.reflect{background:var(--deep);color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden}
.reflect p{font-family:"Readex Pro";font-size:19px;line-height:1.6;position:relative}
.reflect .mirror{transform:scaleY(-1);opacity:.14;filter:blur(1px);margin-top:4px;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.steps{display:flex;gap:6px;margin:12px 0}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--lagoon)}
.q{display:flex;gap:8px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:start;vertical-align:top}
.tbl th{font-size:13px;color:var(--soft);font-weight:600}
.scroll{overflow-x:auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs .btn{flex:none}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surf);border-radius:14px;padding:14px;border:1px solid var(--line)}
.kpi b{display:block;font-family:"Readex Pro";font-size:30px;line-height:1.1}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--lagoon)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prog{font-size:14px}.prog th,.prog td{padding:8px 6px;white-space:nowrap}
.prog .nm{position:sticky;inset-inline-start:0;background:var(--bg);z-index:1;min-width:150px;white-space:normal}
.prog .ck{text-align:center;color:var(--line);font-weight:700}.prog .ck.y{color:var(--ok)}
.prog .vt{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:110px;font-size:13px}
.prog th{text-align:center;vertical-align:bottom}.prog .pc{min-width:90px}.prog .pc .bar{height:6px;margin-top:4px}
.prog tr.me td{background:var(--coralbg)}.prog tfoot td{border-bottom:0}
.kcard{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;background:var(--bg)}
.kcard .qr{width:120px;height:120px;margin:8px auto;background:#fff;padding:6px;border-radius:8px}
.kcard .qr svg{width:100%;height:100%;display:block}
.kcard .code{font-family:"Readex Pro";font-size:24px;letter-spacing:.12em;direction:ltr}
.tmr{font-family:"Readex Pro";font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.screen{min-height:100%;background:var(--deep);color:#fff;padding:28px max(24px,4vw)}
.screen h1{font-size:clamp(32px,5vw,60px)}
.screen .note{background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.screen .tmr{font-size:clamp(48px,9vw,110px)}
.proto{font-size:13px;background:var(--warnbg);color:var(--warn);padding:6px 16px;text-align:center}
.foot{text-align:center;color:var(--soft);font-size:13px;padding:22px 16px 90px}
.toast{position:fixed;inset-inline:16px;bottom:84px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20;text-align:center;animation:up .25s}
@keyframes up{from{transform:translateY(12px);opacity:0}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.25);opacity:0}}
.drop circle.r{transform-origin:170px 170px;animation:ring 4.5s ease-out infinite}
.drop circle.r:nth-child(2){animation-delay:1.5s}.drop circle.r:nth-child(3){animation-delay:3s}
@media(prefers-reduced-motion:reduce){.drop circle.r,.toast{animation:none}}
.gate{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.gate button{text-align:start;padding:18px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);min-height:120px}
.gate button:hover{border-color:var(--lagoon)}
.ex{border-inline-start:4px solid var(--line);padding:8px 12px;border-radius:4px;background:var(--surf)}
.ex.good{border-color:var(--ok)}.ex.bad{border-color:var(--coral)}
@media(max-width:600px){.split{grid-template-columns:minmax(0,1fr)}.tbl{font-size:14px}}
@media(min-width:900px){.dash{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}.dash .side{position:sticky;top:16px}.tabs{flex-direction:column}.tabs .btn{justify-content:flex-start}}

#print{display:none}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}
 #app,.toast{display:none!important}
 #print{display:block}
 .psheet{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
 .psheet .kcard{break-inside:avoid;border-style:solid;border-width:2.5px;padding:4mm;height:85mm;color:#10292e;background:#fff}
 .psheet .kcard .qr{width:38mm;height:38mm}
 .psheet .muted{color:#4d6a6f}
}

async function fillWall(el){
 const key=el.dataset.wl;try{const list=await rpc('t_wall',{p_code:S.me.code,p_pack:PK,p_wall:key});
 const own=el.dataset.editOwn;
 el.innerHTML=list.length?list.map(w=>`<div class="note ${w.mine?'mine':''}">${h(w.body)}${w.mine?`<small>أنت</small>${own?`<div class="row" style="margin-top:6px"><button class="btn sm" data-wedit="${key}:${w.id}">تعديل</button><button class="btn sm" data-wdel="${w.id}">حذف</button></div>`:''}`:''}</div>`).join(''):'<p class="muted">لا مشاركات بعد. ستظهر مشاركات زملائك هنا تلقائياً.</p>';
 el._list=list;setNet(true)}catch(e){setNet(false)}
}
async function fillPeer(el){
 try{const r=await rpc('t_peer',{p_code:S.me.code,p_pack:PK,p_field:el.dataset.peer});
 el.innerHTML=r&&r.text?`<div class="card"><p class="muted">زميلك: أ. ${h((r.name||'').split(' ')[0])}</p><p>${h(r.text)}</p></div>`:'<div class="card"><p class="muted">لم يرسل زملاؤك بعد. ستظهر إجابة زميل هنا تلقائياً خلال لحظات.</p></div>';
 if(!(r&&r.text)){el._tries=(el._tries||0)+1;if(el._tries<20)setTimeout(()=>{if(document.body.contains(el))fillPeer(el)},3000)}}catch(e){}
}
async function loadGallery(){try{const[g,r]=await Promise.all([rpc('t_gallery',{p_code:S.me.code,p_pack:PK}),rpc('t_received',{p_code:S.me.code,p_pack:PK})]);S.gal=g||[];S.recv=r||[];

async function teacherBoot(){
 const qs=new URLSearchParams(location.search);let code=(qs.get('c')||'').toUpperCase();
 if(code){LS.set('taamul-code',code);history.replaceState(null,'',location.pathname)}else code=LS.get('taamul-code','');
 if(!code){S.tv='scan';return R()}
 await login(code);
}
async function login(code){
 S.tv='loading';R();
 let me=null;try{me=await rpc('t_login',{p_code:code})}catch(e){S.tv='scan';R();document.getElementById('scanerr').textContent='تعذّر الاتصال. تأكد من الإنترنت ثم حاول مجدداً.';return}
 if(!me){LS.del('taamul-code');S.tv='scan';R();document.getElementById('scanerr').textContent='لم نجد هذا الرمز. تأكد منه وحاول مرة أخرى.';return}
 S.me=me;LS.set('taamul-code',me.code);
 try{const g=await rpc('t_get',{p_code:me.code,p_pack:PK});const local=LS.get('taamul-d-'+me.code,null);
  const srv=g&&g.data&&Object.keys(g.data).length?g.data:null;S.d=Object.assign(blank(),srv||local||{});
  S.live=g.live;S.timerEnd=g.timer_end;S.note=g.note}catch(e){S.d=Object.assign(blank(),LS.get('taamul-d-'+me.code,{}))}
 S.tv=me.name?'paths':'welcome';R();startTeacherPoll();
}
let tPoll=null;
function startTeacherPoll(){clearInterval(tPoll);tPoll=setInterval(async()=>{if(!S.me||document.hidden)return;
 try{const r=await rpc('t_live',{p_code:S.me.code});setNet(true);const ch=r.live!==S.live;S.live=r.live;S.timerEnd=r.timer_end;const nch=r.note!==S.note;S.note=r.note;
  if(ch){const lb=document.getElementById('lb');if(lb)lb.innerHTML=liveBar();document.querySelectorAll('.act').forEach(b=>b.classList.toggle('live',b.dataset.open===S.live))}
  if(nch&&S.tv==='goalv'&&!typing())R();
  if(S.tv==='act'&&!typing()){document.querySelectorAll('[data-wl]').forEach(fillWall);document.querySelectorAll('[data-peer]').forEach(el=>{if(!el.querySelector('.card p:not(.muted)'))fillPeer(el)});if(S.act==='gallery')loadGallery()}
 }catch(e){setNet(false)}},7000)}

 else if(d.tog){setPath(d.tog,!getPath(d.tog));save()}
 else if(d.bk){const i=D.basket.indexOf(d.bk);if(i>=0)D.basket.splice(i,1);else{D.basket.push(d.bk);toast('أُضيفت إلى سلتك')}save()}
 else if(d.mini!==undefined){const sec=+(d.mini||60);clearInterval(miniT);const end=Date.now()+sec*1000;miniT=setInterval(()=>{const m=document.getElementById('mini');const l=end-Date.now();if(!m||l<=0){clearInterval(miniT);if(m)m.textContent='انتهى الوقت';return}m.textContent=fmt(l)},250);return}
 else if(d.csend!==undefined){const c=D.compass;if(!c.txt.trim()){toast('اكتب إجابتك أولاً');return}
  if(c.share){await rpc('t_post',{p_code:S.me.code,p_pack:PK,p_wall:'compass',p_body:c.txt,p_id:c.pid});if(!c.pid){const l=await rpc('t_wall',{p_code:S.me.code,p_pack:PK,p_wall:'compass'});const m=(l||[]).find(x=>x.mine);c.pid=m?m.id:null}}
  else if(c.pid){await rpc('t_unpost',{p_code:S.me.code,p_id:c.pid});c.pid=null}
  c.sent=true;await saveNow()}
 else if(d.edit){D[d.edit].sent=false;save()}
 else if(d.cyc){const[k,o]=d.cyc.split(':');D.cycle.a[k]=o;D.cycle.checked=false;save()}
 else if(d.ccheck!==undefined){if(Object.keys(D.cycle.a).length<3){toast('اختر للمداخل الثلاثة');return}D.cycle.checked=true;save()}
 else if(d.nsend!==undefined){if(!D.notes.mine.trim()){toast('اكتب ملخصك أولاً');return}D.notes.sent=true;await saveNow()}
 else if(d.nv){D.notes.verdict=d.nv;save()}
 else if(d.nq!==undefined){if(!D.notes.q.trim())return;D.notes.qsent=true;save();toast('وصل سؤالك للمدرب')}
 else if(d.wall){const k=d.wall;const i=document.getElementById('in-'+k);const v=i.value.trim();if(!v)return;el.disabled=true;
  await rpc('t_post',{p_code:S.me.code,p_pack:PK,p_wall:k,p_body:v,p_id:S.editing[k]||null});S.editing[k]=null;i.value='';el.disabled=false;el.textContent='انشر';
  fillWall(document.getElementById('w-'+k));return}
 else if(d.wedit){const[k,id]=d.wedit.split(':');const w=(document.getElementById('w-'+k)._list||[]).find(x=>String(x.id)===id);if(!w)return;
  S.editing[k]=+id;const i=document.getElementById('in-'+k);i.value=w.body;i.focus();const b=document.querySelector(`[data-wall="${k}"]`);if(b)b.textContent='حفظ التعديل';return}
 else if(d.wdel){await rpc('t_unpost',{p_code:S.me.code,p_id:+d.wdel});toast('حُذفت مشاركتك');document.querySelectorAll('[data-wl]').forEach(fillWall);return}
 else if(d.ttype){D.tool.type=d.ttype;save()}
 else if(d.crit){const i=D.tool.crit.indexOf(d.crit);if(i>=0)D.tool.crit.splice(i,1);else if(D.tool.crit.length<5)D.tool.crit.push(d.crit);else toast('خمسة معايير تكفي');save()}
 else if(d.scale){D.tool.scale=d.scale;save()}
 else if(d.tpeer){D.tool.peer=d.tpeer;save()}
 else if(d.tpub!==undefined){D.tool.pub=true;if(!inBasket('التقويم الذاتي بسلم تقدير'))D.basket.push('التقويم الذاتي بسلم تقدير');save();toast('نُشرت أداتك، وأُضيفت فكرتها إلى سلتك')}
 else if(d.galr!==undefined){loadGallery();return}
 else if(d.give){const k=d.give;const g=id=>document.getElementById('g'+k+id).value.trim();const a=g('a'),b=g('b'),c=g('c');if(!a||!c){toast('نجمة وأمنية على الأقل');return}
  el.disabled=true;await rpc('t_give',{p_code:S.me.code,p_pack:PK,p_to:k,p_s1:a,p_s2:b,p_wish:c});S.editing['g'+k]=false;const x=S.gal.find(z=>z.code===k);if(x)x.given={a,b,c};toast('وصلت ملاحظتك لزميلك')}
 else if(d.gedit){S.editing['g'+d.gedit]=true}
 else if(d.gst){D.goal.st=Math.max(0,Math.min(5,D.goal.st+ +d.gst));if(D.goal.st===5)D.goal.text=goalSentence(D.goal);save()}
 else if(d.gset){const p=d.gset.indexOf(':');D.goal[d.gset.slice(0,p)]=d.gset.slice(p+1);save()}
 else if(d.gpeer){D.goal.peer[d.gpeer]=!D.goal.peer[d.gpeer];save()}
 else if(d.gfinal!==undefined){if(!D.goal.text.trim())return;D.goal.final=true;D.done.goal=true;save();toast('اعتُمد هدفك')}
 else if(d.copy){const txt=d.copy==='goal'?D.goal.text:tplText();try{await navigator.clipboard.writeText(txt);toast('نُسخ، الصقه في نمو')}catch(err){toast('تعذّر النسخ التلقائي، انسخه يدوياً')}return}
 else if(d.story){D.task.story=d.story;save()}
 else if(d.tev){const i=D.task.ev.indexOf(d.tev);if(i>=0)D.task.ev.splice(i,1);else D.task.ev.push(d.tev);save()}
 else if(d.tready!==undefined){D.task.ready=true;D.task.status='خطط';D.done.task=true;save();toast('خطتك جاهزة، تجدها في «مهمتي»')}
 else if(d.tstat){D.task.status=d.tstat;save();toast(d.tstat==='سلّم'?'أحسنت، أنجزت المهمة':'رائع، الخطوة التالية كتابة التقرير')}
 else if(d.chk){D.task.check[d.chk]=!D.task.check[d.chk];save()}
 else if(d.dl!==undefined){download();return}
 /* المدرب */
 else if(d.coh){S.tr.cohort=+d.coh;LS.set('taamul-trcoh',S.tr.cohort);S.tr.lastGen=[];return loadDash(true)}
 else if(d.tab){S.tr.tab=d.tab;if(d.tab==='log')rpc('tr_log',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_pack:PK,p_act:null,p_body:''}).then(l=>{S.tr.log=l;if(S.tr.tab==='log')R()})}
 else if(d.live){await rpc('tr_set',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_live:d.live,p_timer_end:null,p_wa:null});toast('ظهر للمعلمين شريط الانتقال');return loadDash(true)}
 else if(d.tstart){const end=new Date(Date.now()+actBy(d.tstart).min*60000).toISOString();await rpc('tr_set',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_live:null,p_timer_end:end,p_wa:null});return loadDash(true)}
 else if(d.tstop!==undefined){await rpc('tr_set',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_live:null,p_timer_end:null,p_wa:null});return loadDash(true)}
 else if(d.wa!==undefined){const v=document.getElementById('wa').value.trim();await rpc('tr_set',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_live:null,p_timer_end:S.timerEnd,p_wa:v});toast('حُفظ الرابط');return loadDash(true)}
 else if(d.sort){S.tr.sort=d.sort}
 else if(d.flt){S.tr.filter=d.flt}
 else if(d.note){const i=document.getElementById('n-'+d.note);if(!i.value.trim())return;await rpc('tr_note',{p_key:S.tr.key,p_code:d.note,p_note:i.value.trim()});toast('وصلت ملاحظتك للمعلم');return loadDash(true)}
 else if(d.noteClear){await rpc('tr_note',{p_key:S.tr.key,p_code:d.noteClear,p_note:''});return loadDash(true)}
 else if(d.rn){S.tr.ed=d.rn;S.tr.mv=null}
 else if(d.mv){S.tr.mv=d.mv;S.tr.ed=null}
 else if(d.rncancel!==undefined){S.tr.ed=S.tr.mv=null}
 else if(d.rnsave){const v=document.getElementById('rn').value.trim();if(v.length<2)return;await rpc('tr_rename',{p_key:S.tr.key,p_code:d.rnsave,p_name:v});S.tr.ed=null;return loadDash(true)}
 else if(d.mvsave){const to=document.getElementById('mvto').value;const ok=await rpc('tr_move',{p_key:S.tr.key,p_from:d.mvsave,p_to:to});S.tr.mv=null;toast(ok?'نُقل المعلم إلى البطاقة '+to:'تعذّر النقل');return loadDash(true)}
 else if(d.addn){S.tr.add=+d.addn}
 else if(d.gen!==undefined){el.disabled=true;const codes=await rpc('tr_gen',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_n:S.tr.add});S.tr.lastGen=codes||[];toast('وُلّدت '+(codes||[]).length+' بطاقة جديدة');return loadDash(true)}
 else if(d.print){return printCards(d.print)}
 else if(d.log!==undefined){const i=document.getElementById('lg');if(!i.value.trim())return;S.tr.log=await rpc('tr_log',{p_key:S.tr.key,p_cohort:S.tr.cohort,p_pack:PK,p_act:S.live,p_body:i.value.trim()});toast('حُفظت الملاحظة')}
 else return;
 }catch(err){toast('تعذّر الاتصال، حاول مرة أخرى');setNet(false);return}
 R();
});
setInterval(()=>{const l=fmt(left());document.querySelectorAll('[data-left]').forEach(x=>x.textContent=l)},500);

/* ===== البدء ===== */
{
 const qs=new URLSearchParams(location.search);
 if(qs.has('trainer')){S.mode='trainer';trBoot();startTrainerPoll()}
 else if(qs.has('screen')){S.mode='screen';screenLoad();scPoll=setInterval(()=>{if(!document.hidden)screenLoad()},5000)}
 else teacherBoot();
}

</script>
